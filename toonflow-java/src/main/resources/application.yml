server:
  port: 10588

spring:
  application:
    name: toonflow
  datasource:
    url: jdbc:sqlite:${user.home}/.toonflow/toonflow.db
    driver-class-name: org.sqlite.JDBC
    username:
    password:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  # Spring AI Alibaba (DashScope)
  ai:
    # 指定默认 ChatModel/EmbeddingModel 由 DashScope 提供，
    # 避免 OpenAI starter 同时注册 ChatModel Bean 造成注入歧义。
    # （OpenAI 兼容供应商在 AiService 中按需手动构建，不依赖自动配置 Bean）
    model:
      chat: dashscope
      embedding: dashscope
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:placeholder}
      chat:
        options:
          model: qwen-max
      embedding:
        options:
          model: text-embedding-v2
    openai:
      api-key: ${OPENAI_API_KEY:placeholder}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: gpt-4o

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

toonflow:
  data-dir: ${user.home}/.toonflow
  jwt:
    expiration: 15552000  # 180 days in seconds

logging:
  level:
    com.toonflow: debug
    org.springframework.security: warn
